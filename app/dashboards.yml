- dashboard_id: workforce
  title: Workforce footprint
  description: Active employees and contracted capacity by home office.
  keywords:
  - employees
  - workforce
  - staff
  - headcount
  - fte
  kpi_tags:
  - Active employees
  - Active workforce capacity
  business_purpose: Plan staffing against contracted workforce capacity.
  supported_questions:
  - How many active people are based at each office?
  - How much contracted capacity does each team have?
  dimensions:
  - home office
  - team
  - role
  source_tables:
  - workforce.employees
  - locations.offices
  dashboard_url: https://example.org/#workforce
- dashboard_id: estate
