<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora | Dashboard discovery</title>
  <link rel="icon" href="/static/image/HSBC_logo_(2018)%20(1).svg">
  <link rel="stylesheet" href="/static/style.css?v=15">
  <link rel="stylesheet" href="/static/conversation.css">
  <script defer src="/static/chart.js"></script>
  <script defer src="/static/conversation.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/image/HSBC_logo_(2018)%20(1).svg" alt="HSBC" width="102" height="30">
      <span class="brand-divider"></span><span class="brand-name">Nexora</span></a>
    <nav class="top-nav" aria-label="Workspaces"><a href="/conversation" aria-current="page">Conversation</a><a href="/employees">Employee workspace</a></nav>
  </header>
  <main class="conversation">
    <div class="conversation-heading"><h1>Ask Nexora</h1><button id="new-thread" type="button">New conversation</button></div>
    <div class="conversation-columns">
      <section class="conversation-panel" aria-label="Question and answer">
        <p id="original" hidden></p>
        <section id="discovery" hidden>
          <h2>Matching dashboards</h2><p id="match-method"></p><div id="matches"></div>
          <button type="button" id="answer-here" class="primary">Answer Here</button>
        </section>
        <section id="insight" hidden>
          <h2 id="insight-title">Answer</h2><p id="insight-answer"></p><p id="scope"></p><p id="definition"></p>
          <details id="answer-chart" hidden><summary>View chart</summary><figure>
            <figcaption id="chart-caption"></figcaption><div id="answer-bars"></div>
          </figure></details>
          <details id="evidence"><summary>SQL and evidence</summary>
            <p id="sources"></p><pre id="query"></pre><p id="parameters"></p><table id="evidence-rows"></table>
          </details>
        </section>
        <p id="notice" role="status" hidden></p>
        <form id="conversation-form">
          <label for="message" id="composer-label">Your question</label>
          <textarea id="message" rows="3" required placeholder="Ask about your offices, workforce or portfolio"></textarea>
          <button type="submit" id="send" class="primary">Find dashboards</button>
        </form>
        <p id="run-status" role="status"></p>
      </section>
      <aside class="conversation-panel side-panel">
        <section id="suggestions"><h2>Try a question</h2><div id="example-list"></div></section>
        <section id="recent" hidden><h2>This conversation</h2><ol id="history"></ol></section>
      </aside>
    </div>
  </main>
</body>
</html>
